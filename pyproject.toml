[build-system]
requires = ['maturin>=1,<2']
build-backend = 'maturin'

[project]
name = 'space-graph'
version = '2.0.1'
description = 'Python SPACE: sparse partial correlation estimation'
readme = 'README.md'
requires-python = '>=3.10'
license = { text = 'GPL-3.0-or-later' }
dependencies = [
    'numpy>=1.20',
]

[tool.maturin]
module-name = 'space_graph._rust'
python-source = '.'

[tool.pytest.ini_options]
testpaths = ['tests']
pythonpath = ['.']
